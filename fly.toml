# Fly.io configuration for Telegram MCP Server
# See https://fly.io/docs/reference/configuration/

app = "telegram-mcp-jks"
primary_region = "lhr"  # London - change to your preferred region

[build]
  dockerfile = "Dockerfile.sse"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # Keep running for SSE connections
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1  # SSE requires sticky sessions - only 1 machine

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "10s"
    type = "http"
