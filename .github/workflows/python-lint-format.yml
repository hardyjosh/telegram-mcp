name: Python Lint & Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-format:
    name: Check Linting & Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Lint with Flake8
        run: |
          nix develop --command flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          nix develop --command flake8 . --count --exit-zero --max-complexity=10 --max-line-length=99 --statistics

      - name: Check formatting with Black
        run: nix develop --command black --check .
